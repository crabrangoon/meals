<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>Meal Planner</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f7fb;
      color: #222;
    }

    header {
      background: #2d3748;
      color: white;
      padding: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    h1 {
      margin: 0;
      font-size: 24px;
    }

    button {
      border: none;
      background: #4f46e5;
      color: white;
      padding: 10px 14px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
    }

    button:hover {
      opacity: 0.9;
    }

    .danger {
      background: #ef4444;
    }

    .add-form {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      padding: 14px;
      background: white;
      box-shadow: 0 2px 6px rgba(0,0,0,0.05);
    }

    input,
    textarea,
    select {
      padding: 10px;
      border-radius: 8px;
      border: 1px solid #ccc;
      font-size: 14px;
    }

    textarea {
      resize: vertical;
    }

    .board {
      display: flex;
      flex-direction: column;
      gap: 14px;
      padding: 14px;
    }

    .day-column {
      background: white;
      border-radius: 14px;
      padding: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    .day-column h2 {
      margin-top: 0;
      margin-bottom: 12px;
    }

    .meal-list {
      min-height: 70px;
      border-radius: 10px;
      padding: 6px;
      transition: background 0.2s ease;
    }

    .drop-zone {
      background: #dbeafe;
      border: 2px dashed #60a5fa;
    }

    .meal-card {
      background: #edf2ff;
      border-left: 5px solid #4f46e5;
      border-radius: 10px;
      padding: 12px;
      margin-bottom: 10px;
      touch-action: none;
      cursor: grab;
      user-select: none;
    }

    .meal-card.dragging {
      opacity: 0.5;
    }

    .meal-card h3 {
      margin: 0 0 8px;
      font-size: 16px;
    }

    .meal-card p {
      margin: 0;
      color: #444;
      font-size: 14px;
    }

    .card-actions {
      margin-top: 10px;
      display: flex;
      justify-content: flex-end;
    }

    .delete-btn {
      background: #ef4444;
      font-size: 12px;
      padding: 6px 10px;
      touch-action: manipulation;
    }

    @media (max-width: 600px) {

      .add-form {
        flex-direction: column;
      }

      input,
      textarea,
      select,
      button {
        width: 100%;
      }
    }

  </style>
</head>

<body>

<header>

  <h1>🍽️ Meal Planner</h1>

  <div style="display:flex; gap:10px;">

    <button id="refreshBtn">
      Refresh
    </button>

    <button
      class="danger"
      id="clearBtn"
    >
      Clear All
    </button>

  </div>

</header>

<section class="add-form">

  <input
    type="text"
    id="title"
    placeholder="Meal name"
  />

  <textarea
    id="desc"
    rows="1"
    placeholder="Description"
  ></textarea>

  <select id="day">

    <option>Monday</option>
    <option>Tuesday</option>
    <option>Wednesday</option>
    <option>Thursday</option>
    <option>Friday</option>
    <option>Saturday</option>
    <option>Sunday</option>

  </select>

  <button id="addBtn">
    Add Meal
  </button>

</section>

<section
  class="board"
  id="board"
></section>

<script type="module">

  import {
    createClient
  } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm";

  // =========================
  // SUPABASE
  // =========================

  const supabase = createClient(
  "https://oztcdivlafckayzoensb.supabase.co",
  "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im96dGNkaXZsYWZja2F5em9lbnNiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkwOTA1ODIsImV4cCI6MjA5NDY2NjU4Mn0.5SOpvBqBSuGDdqd8xsD3ocKZtPV5fwwtvJ0yfwW0viU"
);

  // =========================
  // CONSTANTS
  // =========================

  const DAYS = [
    "Monday",
    "Tuesday",
    "Wednesday",
    "Thursday",
    "Friday",
    "Saturday",
    "Sunday"
  ];

  let meals = [];

  // =========================
  // LOAD MEALS
  // =========================

  async function loadMeals() {

    const {
      data,
      error
    } = await supabase
      .from("meals")
      .select("*")
      .order("created_at");

    if (error) {
      console.error(error);
      return;
    }

    meals = data || [];

    render();
  }

  // =========================
  // GROUP
  // =========================

  function groupMeals() {

    const grouped =
      Object.fromEntries(
        DAYS.map(day => [day, []])
      );

    meals.forEach(meal => {

      if (grouped[meal.day]) {
        grouped[meal.day].push(meal);
      }
    });

    return grouped;
  }

  // =========================
  // RENDER
  // =========================

  function render() {

    const board =
      document.getElementById("board");

    board.innerHTML = "";

    const grouped = groupMeals();

    DAYS.forEach(day => {

      const column =
        document.createElement("div");

      column.className =
        "day-column";

      column.innerHTML = `
        <h2>${day}</h2>

        <div
          class="meal-list"
          data-day="${day}"
        ></div>
      `;

      const list =
        column.querySelector(
          ".meal-list"
        );

      grouped[day].forEach(meal => {

        list.appendChild(
          createMealCard(meal)
        );
      });

      addDropEvents(list);

      board.appendChild(column);
    });
  }

  // =========================
  // CREATE CARD
  // =========================

  function createMealCard(meal) {

    const card =
      document.createElement("div");

    card.className =
      "meal-card";

    card.draggable = true;

    card.dataset.id = meal.id;

    card.innerHTML = `
      <h3>${meal.title}</h3>

      <p>
        ${meal.description || ""}
      </p>

      <div class="card-actions">

        <button
          class="delete-btn"
        >
          Delete
        </button>

      </div>
    `;

    // =====================
    // DESKTOP DRAG
    // =====================

    card.addEventListener(
      "dragstart",
      () => {

        card.classList.add(
          "dragging"
        );
      }
    );

    card.addEventListener(
      "dragend",
      async () => {

        card.classList.remove(
          "dragging"
        );

        clearDropZones();

        await syncDOMToSupabase();
      }
    );

    // =====================
    // TOUCH DRAG
    // =====================

    card.addEventListener(
      "pointerdown",
      e => {

        if (
          e.target.closest(
            ".delete-btn"
          )
        ) {
          return;
        }

        card.setPointerCapture(
          e.pointerId
        );

        card.classList.add(
          "dragging"
        );

        function move(ev) {

          const target =
            document.elementFromPoint(
              ev.clientX,
              ev.clientY
            );

          const list =
            target?.closest?.(
              ".meal-list"
            );

          if (
            list &&
            list !== card.parentElement
          ) {
            list.appendChild(card);
          }
        }

        async function up() {

          card.classList.remove(
            "dragging"
          );

          clearDropZones();

          await syncDOMToSupabase();

          card.removeEventListener(
            "pointermove",
            move
          );

          card.removeEventListener(
            "pointerup",
            up
          );
        }

        card.addEventListener(
          "pointermove",
          move
        );

        card.addEventListener(
          "pointerup",
          up
        );
      }
    );

    // =====================
    // DELETE
    // =====================

    const deleteBtn =
      card.querySelector(
        ".delete-btn"
      );

    deleteBtn.addEventListener(
      "pointerdown",
      e => {

        e.stopPropagation();
      }
    );

    deleteBtn.addEventListener(
      "click",
      async e => {

        e.stopPropagation();

        await deleteMeal(meal.id);
      }
    );

    return card;
  }

  // =========================
  // DROP EVENTS
  // =========================

  function addDropEvents(container) {

    container.addEventListener(
      "dragover",
      e => {

        e.preventDefault();

        clearDropZones();

        container.classList.add(
          "drop-zone"
        );

        const dragging =
          document.querySelector(
            ".dragging"
          );

        if (
          dragging &&
          dragging.parentNode !== container
        ) {
          container.appendChild(
            dragging
          );
        }
      }
    );

    container.addEventListener(
      "drop",
      async () => {

        clearDropZones();

        await syncDOMToSupabase();
      }
    );
  }

  function clearDropZones() {

    document
      .querySelectorAll(
        ".meal-list"
      )
      .forEach(list => {

        list.classList.remove(
          "drop-zone"
        );
      });
  }

  // =========================
  // SYNC TO DB
  // =========================

  async function syncDOMToSupabase() {

    const updates = [];

    DAYS.forEach(day => {

      const list =
        document.querySelector(
          `[data-day="${day}"]`
        );

      list
        .querySelectorAll(
          ".meal-card"
        )
        .forEach(card => {

          updates.push({
            id: card.dataset.id,
            day
          });
        });
    });

    for (const update of updates) {

      await supabase
        .from("meals")
        .update({
          day: update.day
        })
        .eq("id", update.id);
    }

    await loadMeals();
  }

  // =========================
  // ADD
  // =========================

  async function addMeal() {

    const titleInput =
      document.getElementById(
        "title"
      );

    const descInput =
      document.getElementById(
        "desc"
      );

    const dayInput =
      document.getElementById(
        "day"
      );

    const title =
      titleInput.value.trim();

    const description =
      descInput.value.trim();

    const day =
      dayInput.value;

    if (!title) {
      return;
    }

    const { error } =
      await supabase
        .from("meals")
        .insert({
          id: crypto.randomUUID(),
          title,
          description,
          day
        });

    if (error) {
      console.error(error);
      return;
    }

    titleInput.value = "";
    descInput.value = "";

    await loadMeals();
  }

  // =========================
  // DELETE
  // =========================

  async function deleteMeal(id) {

    const { error } =
      await supabase
        .from("meals")
        .delete()
        .eq("id", id);

    if (error) {
      console.error(error);
      alert(error.message);
      return;
    }

    meals =
      meals.filter(
        meal => meal.id !== id
      );

    render();
  }

  // =========================
  // CLEAR ALL
  // =========================

  async function clearMeals() {

    const ok =
      window.confirm(
        "Delete all meals?"
      );

    if (!ok) {
      return;
    }

    const { error } =
      await supabase
        .from("meals")
        .delete()
        .not("id", "is", null);

    if (error) {
      console.error(error);
      alert(error.message);
      return;
    }

    meals = [];

    render();
  }

  // =========================
  // BUTTON EVENTS
  // =========================

  document
    .getElementById("addBtn")
    .addEventListener(
      "click",
      addMeal
    );

  document
    .getElementById("refreshBtn")
    .addEventListener(
      "click",
      loadMeals
    );

  document
    .getElementById("clearBtn")
    .addEventListener(
      "click",
      clearMeals
    );

  // =========================
  // INITIAL LOAD
  // =========================

  loadMeals();

</script>

</body>
</html>
