<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Meal Planner</title>

<style>

*{box-sizing:border-box}

:root{
  --bg:#f5f7fb;
  --text:#222;
  --card:#fff;
  --meal:#edf2ff;
  --header:#2d3748;
  --border:#ccc;
  --drop:#dbeafe;
  --btn:#4f46e5;
  --danger:#ef4444;
}

body.dark{
  --bg:#111827;
  --text:#f3f4f6;
  --card:#1f2937;
  --meal:#374151;
  --header:#030712;
  --border:#4b5563;
  --drop:#1e40af;
  --btn:#6366f1;
}

body{
  margin:0;
  font-family:Arial;
  background:var(--bg);
  color:var(--text);
}

header{
  background:var(--header);
  color:#fff;
  padding:14px;
  display:flex;
  justify-content:space-between;
  flex-wrap:wrap;
}

button{
  background:var(--btn);
  border:0;
  padding:10px 12px;
  border-radius:8px;
  color:white;
}

.danger{background:var(--danger)}

.add-form{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  padding:12px;
  background:var(--card);
}

input,textarea,select{
  padding:10px;
  border-radius:8px;
  border:1px solid var(--border);
  background:var(--card);
  color:var(--text);
}

.board{
  padding:12px;
  display:flex;
  flex-direction:column;
  gap:14px;
}

.day-column{
  background:var(--card);
  padding:12px;
  border-radius:12px;
}

.meal-list{
  min-height:60px;
  padding:6px;
}

.meal-card{
  background:var(--meal);
  border-left:5px solid #4f46e5;
  padding:12px;
  margin-bottom:10px;
  border-radius:10px;
  cursor:grab;
  user-select:none;
  touch-action:none;
}

.meal-card.dragging{
  opacity:0.5;
  position:relative;
  z-index:999;
}

.card-actions{
  display:flex;
  justify-content:flex-end;
}

.delete-btn{
  background:var(--danger);
  border:0;
  padding:6px 10px;
  border-radius:6px;
  font-size:12px;
}

.drop-zone{
  background:var(--drop);
  border:2px dashed #60a5fa;
}

</style>
</head>

<body>

<header>
  <h1>🍽️ Meal Planner</h1>

  <div style="display:flex;gap:10px;">
    <button id="themeBtn">🌙 Dark</button>
    <button id="refreshBtn">Refresh</button>
    <button id="clearBtn" class="danger">Clear</button>
  </div>
</header>

<section class="add-form">
  <input id="title" placeholder="Meal"/>
  <textarea id="desc" placeholder="Description"></textarea>

  <select id="day">
    <option>Monday</option><option>Tuesday</option>
    <option>Wednesday</option><option>Thursday</option>
    <option>Friday</option><option>Saturday</option>
    <option>Sunday</option>
  </select>

  <button id="addBtn">Add</button>
</section>

<section id="board" class="board"></section>

<script type="module">

import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm";

const supabase = createClient(
  "https://oztcdivlafckayzoensb.supabase.co",
  "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im96dGNkaXZsYWZja2F5em9lbnNiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkwOTA1ODIsImV4cCI6MjA5NDY2NjU4Mn0.5SOpvBqBSuGDdqd8xsD3ocKZtPV5fwwtvJ0yfwW0viU"
);


const DAYS = ["Monday","Tuesday","Wednesday","Thursday","Friday","Saturday","Sunday"];

let meals = [];

// ---------------- LOAD ----------------
async function loadMeals(){
  const { data } = await supabase
    .from("meals")
    .select("*")
    .order("day")
    .order("position");

  meals = data || [];
  render();
}

// ---------------- GROUP ----------------
function group(){
  const g = Object.fromEntries(DAYS.map(d=>[d,[]]));
  meals.forEach(m=>g[m.day]?.push(m));
  return g;
}

// ---------------- COLOR ----------------
function color(id){
  const c=["#fee2e2","#ffedd5","#fef9c3","#dcfce7","#dbeafe","#e0e7ff","#fce7f3"];
  let h=0;
  for(let i=0;i<id.length;i++)h=id.charCodeAt(i)+((h<<5)-h);
  return c[Math.abs(h)%c.length];
}

// ---------------- RENDER ----------------
function render(){

  const board=document.getElementById("board");
  board.innerHTML="";

  const grouped=group();

  DAYS.forEach(day=>{

    const col=document.createElement("div");
    col.className="day-column";

    col.innerHTML=`
      <h2>${day}</h2>
      <div class="meal-list" data-day="${day}"></div>
    `;

    const list=col.querySelector(".meal-list");

    grouped[day].forEach(m=>{
      list.appendChild(card(m));
    });

    board.appendChild(col);
  });
}

// ---------------- CARD (ONLY POINTER DRAG) ----------------
function card(m){

  const el=document.createElement("div");
  el.className="meal-card";
  el.dataset.id=m.id;

  el.style.background =
    document.body.classList.contains("dark")
      ? "#374151"
      : color(m.id);

  el.innerHTML=`
    <h3>${m.title}</h3>
    <p>${m.description||""}</p>
    <div class="card-actions">
      <button class="delete-btn">Delete</button>
    </div>
  `;

  // POINTER DRAG ONLY (stable)
  el.addEventListener("pointerdown",e=>{

    if(e.target.closest(".delete-btn")) return;

    el.setPointerCapture(e.pointerId);
    el.classList.add("dragging");

    function move(ev){

      const target=document.elementFromPoint(ev.clientX,ev.clientY);
      const list=target?.closest?.(".meal-list");
      if(!list) return;

      const cards=[...list.querySelectorAll(".meal-card")].filter(c=>c!==el);

      const after=cards.find(c=>{
        const r=c.getBoundingClientRect();
        return ev.clientY < r.top + r.height/2;
      });

      if(!after) list.appendChild(el);
      else list.insertBefore(el,after);
    }

    async function up(){

      el.classList.remove("dragging");

      el.removeEventListener("pointermove",move);
      el.removeEventListener("pointerup",up);

      await sync(); // ONLY HERE (no mid drag sync)
    }

    el.addEventListener("pointermove",move);
    el.addEventListener("pointerup",up);
  });

  el.querySelector(".delete-btn").onclick=async e=>{
    e.stopPropagation();
    await supabase.from("meals").delete().eq("id",m.id);
    await loadMeals();
  };

  return el;
}

// ---------------- SYNC (SAFE) ----------------
async function sync(){

  const updates=[];

  DAYS.forEach(day=>{

    const list=document.querySelector(`[data-day="${day}"]`);
    const cards=[...list.querySelectorAll(".meal-card")];

    cards.forEach((c,i)=>{
      updates.push({
        id:c.dataset.id,
        day,
        position:i
      });
    });

  });

  for(const u of updates){
    await supabase
      .from("meals")
      .update({
        day:u.day,
        position:u.position
      })
      .eq("id",u.id);
  }

  await loadMeals();
}

// ---------------- ADD ----------------
async function add(){

  const title=titleEl.value.trim();
  const desc=descEl.value.trim();
  const day=dayEl.value;

  if(!title) return;

  await supabase.from("meals").insert({
    id:crypto.randomUUID(),
    title,
    description:desc,
    day,
    position:0
  });

  titleEl.value="";
  descEl.value="";

  await loadMeals();
}

// ---------------- CLEAR ----------------
async function clearAll(){
  if(!confirm("Delete all?")) return;
  await supabase.from("meals").delete().not("id","is",null);
  meals=[];
  render();
}

// ---------------- THEME ----------------
document.getElementById("themeBtn").onclick=()=>{
  document.body.classList.toggle("dark");
};

// ---------------- UI ----------------
const titleEl=document.getElementById("title");
const descEl=document.getElementById("desc");
const dayEl=document.getElementById("day");

document.getElementById("addBtn").onclick=add;
document.getElementById("refreshBtn").onclick=loadMeals;
document.getElementById("clearBtn").onclick=clearAll;

// ---------------- INIT ----------------
loadMeals();

</script>

</body>
</html>
