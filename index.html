<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Meal Planner</title>

  <style>

    * {
      box-sizing: border-box;
    }

    :root {
      --bg: #f5f7fb;
      --text: #222;
      --header: #2d3748;
      --card: white;
      --meal: #edf2ff;
      --border: #ccc;
      --drop: #dbeafe;
      --button: #4f46e5;
      --danger: #ef4444;
    }

    body.dark {
      --bg: #111827;
      --text: #f3f4f6;
      --header: #030712;
      --card: #1f2937;
      --meal: #374151;
      --border: #4b5563;
      --drop: #1e40af;
      --button: #6366f1;
      --danger: #ef4444;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      transition: background 0.25s ease, color 0.25s ease;
    }

    header {
      background: var(--header);
      color: white;
      padding: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
    }

    h1 {
      margin: 0;
      font-size: 24px;
    }

    button {
      border: none;
      background: var(--button);
      color: white;
      padding: 10px 14px;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
    }

    .danger {
      background: var(--danger);
    }

    .add-form {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      padding: 14px;
      background: var(--card);
    }

    input, textarea, select {
      padding: 10px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--text);
    }

    .board {
      display: flex;
      flex-direction: column;
      gap: 14px;
      padding: 14px;
    }

    .day-column {
      background: var(--card);
      border-radius: 14px;
      padding: 12px;
    }

    .meal-list {
      min-height: 60px;
      padding: 6px;
      border-radius: 10px;
    }

    .drop-zone {
      background: var(--drop);
      border: 2px dashed #60a5fa;
    }

    .meal-card {
      border-left: 6px solid #4f46e5;
      border-radius: 10px;
      padding: 12px;
      margin-bottom: 10px;
      touch-action: none;
      user-select: none;
      cursor: grab;
    }

    .meal-card.dragging {
      opacity: 0.5;
    }

    .card-actions {
      display: flex;
      justify-content: flex-end;
      margin-top: 8px;
    }

    .delete-btn {
      background: var(--danger);
      padding: 6px 10px;
      font-size: 12px;
      border-radius: 6px;
      touch-action: manipulation;
    }

    @media (max-width: 600px) {
      .add-form {
        flex-direction: column;
      }

      input, textarea, select, button {
        width: 100%;
      }
    }

  </style>
</head>

<body>

<header>
  <h1>🍽️ Meal Planner</h1>

  <div style="display:flex; gap:10px; flex-wrap:wrap;">
    <button id="themeBtn">🌙 Dark Mode</button>
    <button id="refreshBtn">Refresh</button>
    <button class="danger" id="clearBtn">Clear All</button>
  </div>
</header>

<section class="add-form">

  <input id="title" placeholder="Meal name"/>
  <textarea id="desc" placeholder="Description"></textarea>

  <select id="day">
    <option>Monday</option>
    <option>Tuesday</option>
    <option>Wednesday</option>
    <option>Thursday</option>
    <option>Friday</option>
    <option>Saturday</option>
    <option>Sunday</option>
  </select>

  <button id="addBtn">Add Meal</button>

</section>

<section id="board" class="board"></section>

<script type="module">

import { createClient }
from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm";

const supabase = createClient(
  "https://oztcdivlafckayzoensb.supabase.co",
  "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im96dGNkaXZsYWZja2F5em9lbnNiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkwOTA1ODIsImV4cCI6MjA5NDY2NjU4Mn0.5SOpvBqBSuGDdqd8xsD3ocKZtPV5fwwtvJ0yfwW0viU"
);

const DAYS = ["Monday","Tuesday","Wednesday","Thursday","Friday","Saturday","Sunday"];

let meals = [];

// ---------- COLOR SYSTEM ----------
function getCardColor(id) {
  const colors = [
    "#fee2e2","#ffedd5","#fef9c3",
    "#dcfce7","#dbeafe","#e0e7ff","#fce7f3"
  ];

  let hash = 0;
  for (let i=0;i<id.length;i++) {
    hash = id.charCodeAt(i) + ((hash << 5) - hash);
  }

  return colors[Math.abs(hash) % colors.length];
}

// ---------- LOAD ----------
async function loadMeals() {
  const { data, error } = await supabase
    .from("meals")
    .select("*")
    .order("created_at");

  if (error) return console.error(error);

  meals = data || [];
  render();
}

// ---------- GROUP ----------
function groupMeals() {
  const grouped = Object.fromEntries(DAYS.map(d => [d, []]));
  meals.forEach(m => grouped[m.day]?.push(m));
  return grouped;
}

// ---------- RENDER ----------
function render() {
  const board = document.getElementById("board");
  board.innerHTML = "";

  const grouped = groupMeals();

  DAYS.forEach(day => {

    const column = document.createElement("div");
    column.className = "day-column";

    column.innerHTML = `
      <h2>${day}</h2>
      <div class="meal-list" data-day="${day}"></div>
    `;

    const list = column.querySelector(".meal-list");

    grouped[day].forEach(meal => {
      list.appendChild(createCard(meal));
    });

    addDrop(list);
    board.appendChild(column);
  });
}

// ---------- CARD ----------
function createCard(meal) {

  const card = document.createElement("div");
  card.className = "meal-card";
  card.draggable = true;
  card.dataset.id = meal.id;

  card.style.background =
    bodyDark()
      ? "#374151"
      : getCardColor(meal.id);

  card.innerHTML = `
    <h3>${meal.title}</h3>
    <p>${meal.description || ""}</p>
    <div class="card-actions">
      <button class="delete-btn">Delete</button>
    </div>
  `;

  card.addEventListener("dragstart", () => {
    card.classList.add("dragging");
  });

  card.addEventListener("dragend", async () => {
    card.classList.remove("dragging");
    clearDrop();
    await sync();
  });

  card.addEventListener("pointerdown", e => {

    if (e.target.closest(".delete-btn")) return;

    card.setPointerCapture(e.pointerId);
    card.classList.add("dragging");

    function move(ev) {
      const el = document.elementFromPoint(ev.clientX, ev.clientY);
      const list = el?.closest?.(".meal-list");
      if (list && list !== card.parentElement) {
        list.appendChild(card);
      }
    }

    async function up() {
      card.classList.remove("dragging");
      clearDrop();
      await sync();

      card.removeEventListener("pointermove", move);
      card.removeEventListener("pointerup", up);
    }

    card.addEventListener("pointermove", move);
    card.addEventListener("pointerup", up);
  });

  card.querySelector(".delete-btn").addEventListener("click", async (e) => {
    e.stopPropagation();
    await deleteMeal(meal.id);
  });

  return card;
}

// ---------- DROP ----------
function addDrop(list) {
  list.addEventListener("dragover", e => {
    e.preventDefault();
    clearDrop();
    list.classList.add("drop-zone");

    const dragging = document.querySelector(".dragging");
    if (dragging && dragging.parentNode !== list) {
      list.appendChild(dragging);
    }
  });

  list.addEventListener("drop", async () => {
    clearDrop();
    await sync();
  });
}

function clearDrop() {
  document.querySelectorAll(".meal-list")
    .forEach(l => l.classList.remove("drop-zone"));
}

// ---------- SYNC ----------
async function sync() {

  const updates = [];

  DAYS.forEach(day => {
    const list = document.querySelector(`[data-day="${day}"]`);

    list.querySelectorAll(".meal-card").forEach(card => {
      updates.push({
        id: card.dataset.id,
        day
      });
    });
  });

  for (const u of updates) {
    await supabase
      .from("meals")
      .update({ day: u.day })
      .eq("id", u.id);
  }

  await loadMeals();
}

// ---------- ADD ----------
async function addMeal() {

  const title = titleEl.value.trim();
  const desc = descEl.value.trim();
  const day = dayEl.value;

  if (!title) return;

  await supabase.from("meals").insert({
    id: crypto.randomUUID(),
    title,
    description: desc,
    day
  });

  titleEl.value = "";
  descEl.value = "";

  await loadMeals();
}

// ---------- DELETE ----------
async function deleteMeal(id) {

  await supabase
    .from("meals")
    .delete()
    .eq("id", id);

  meals = meals.filter(m => m.id !== id);
  render();
}

// ---------- CLEAR ----------
async function clearMeals() {

  const ok = confirm("Delete all meals?");
  if (!ok) return;

  await supabase
    .from("meals")
    .delete()
    .not("id","is",null);

  meals = [];
  render();
}

// ---------- DARK MODE ----------
function bodyDark() {
  return document.body.classList.contains("dark");
}

function toggleTheme() {
  const dark = bodyDark();
  document.body.classList.toggle("dark", !dark);
  localStorage.setItem("theme", !dark ? "dark" : "light");
  applyTheme();
}

function applyTheme() {
  const t = localStorage.getItem("theme") || "light";
  document.body.classList.toggle("dark", t === "dark");
}

// ---------- BUTTONS ----------
const titleEl = document.getElementById("title");
const descEl = document.getElementById("desc");
const dayEl = document.getElementById("day");

document.getElementById("addBtn").addEventListener("click", addMeal);
document.getElementById("refreshBtn").addEventListener("click", loadMeals);
document.getElementById("clearBtn").addEventListener("click", clearMeals);
document.getElementById("themeBtn").addEventListener("click", toggleTheme);

// ---------- INIT ----------
applyTheme();
loadMeals();

</script>

</body>
</html>
